name: Release

# Automated release pipeline. The manual flow stays the same up to publishing:
# commit on main, bump + build locally, changelog entry, commit, then
#   gh release create vX.Y.Z --title "Image Search v3 vX.Y.Z" --notes "<release notes>"
# Publishing fires this workflow (no asset needed on the create call), which:
#   1. runs the unit tests (fail fast: nothing broken ships),
#   2. rebuilds the .ankiaddon from the tag (version forced to the tag),
#   3. attaches it to the GitHub release (overwriting on re-runs),
#   4. uploads the same file to AnkiWeb (addon 178037783) via
#      athulkrishna2015/ankiweb-api@v1, preserving the listing's title,
#      tags, support page and single open-ended branch, and refreshing the
#      listing description from README.md.
#
# Branch syntax gotcha: the uploader rejects a bare `2.1.1+` with
# "The branch must have 2 versions separated by dash". A branch must always
# be `min-max`, where the trailing `+` is what makes it open-ended -- so
# `2.1.1-26.05+` keeps the listing's existing "all versions" coverage while
# passing validation.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions -> Secrets):
#   - ANKIWEB_USERNAME  (AnkiWeb login email)
#   - ANKIWEB_PASSWORD  (plain-password auth; interactive 2FA is unsupported)
# To rebuild/republish an existing tag without cutting a new release:
# Actions -> Release -> Run workflow -> enter the tag (e.g. v3.12.2).
# To rehearse the pipeline (tests + build + description check) without
# touching the release or AnkiWeb: same dialog, tick `dry_run`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild/republish (e.g. v3.12.2). With dry_run, a branch (e.g. main) is also accepted."
        required: true
      dry_run:
        description: "Rehearse only: run tests and the build, skip the release + AnkiWeb uploads"
        type: boolean
        default: false

permissions:
  contents: write # attach the .ankiaddon to the release

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ref="${EVENT_TAG:-$INPUT_REF}"
          if [ -z "$ref" ]; then
            echo "::error::No ref given. Pass one via workflow_dispatch." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Fail early and legibly. A ref that does not exist otherwise
          # surfaces much later as a raw "upload-pack: not our ref" failure
          # from actions/checkout, and a missing release only fails at the
          # attach step -- after the tests and build have already run.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ref}" >/dev/null 2>&1; then
            is_tag=true
          elif [ "$DRY_RUN" = "true" ] && gh api "repos/${GITHUB_REPOSITORY}/branches/${ref}" >/dev/null 2>&1; then
            # Branch builds are rehearsal-only: a real release always ships
            # from a tag, so nothing may ever be published off an untagged commit.
            is_tag=false
            echo "::notice::'$ref' is a branch, not a tag; dry run only, nothing will be published."
          else
            echo "::error::'$ref' is neither a tag nor a branch in this repository." >&2
            exit 1
          fi
          # --repo is mandatory here: this step runs before actions/checkout,
          # so gh has no git remote to infer the repository from and would fail
          # with "failed to run git" instead of answering the question.
          if [ "$is_tag" = "true" ] && ! gh release view "$ref" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::No GitHub release found for '$ref'. Create one first." >&2
              exit 1
            fi
            echo "::warning::No GitHub release for '$ref'; a dry run skips the uploads anyway."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: the release and AnkiWeb upload steps will be skipped."
          fi

      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Building $version from $TAG"
          elif [ "$DRY_RUN" = "true" ]; then
            # Branch rehearsal: there is no version tag, so use the version the
            # working tree already carries. Never published -- a real release
            # always builds from a tag.
            version=$(cat addon/VERSION)
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::addon/VERSION is '$version', which is not a version." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Dry run from branch '$TAG': building with the tree's version $version"
          else
            echo "::error::'$TAG' is not a version tag (expected v<major>.<minor>[.<patch>])." >&2
            exit 1
          fi
        env:
          TAG: ${{ steps.ref.outputs.ref }}
          DRY_RUN: ${{ steps.ref.outputs.dry_run }}

      - name: Run unit tests
        run: |
          set -euo pipefail
          # The runner has no Anki install; the suites stub `aqt`/`anki`
          # themselves. pytest and requests are still needed as test-time
          # tooling (the latter is a real add-on dependency of the providers).
          python3 -m pip install --quiet --disable-pip-version-check pytest requests
          # Two interpreters, not one per file, because the suites share
          # global stubs and pollute each other in *both* directions:
          #   - test_yandex_official installs an `addon.utils` stub that breaks
          #     its neighbours, so it runs alone;
          #   - test_utils only imports cleanly once a sibling suite has put
          #     the `anki`/`aqt` stubs in sys.modules, so it must NOT run alone.
          python3 -m pytest tests/ -q --ignore=tests/test_yandex_official.py
          python3 -m pytest tests/test_yandex_official.py -q

      - name: Build .ankiaddon
        id: build
        run: |
          set -euo pipefail
          python3 make_ankiaddon.py "${{ steps.version.outputs.version }}"
          file=$(ls Image_Search_v3_v*.ankiaddon)
          echo "ankiaddon=$file" >> "$GITHUB_OUTPUT"
          echo "Built $file"

      - name: Check AnkiWeb description size
        run: |
          set -euo pipefail
          # AnkiWeb rejects descriptions over 65535 bytes -- and rejects them
          # *silently from the add-on's point of view*: the upload fails and the
          # listing keeps its previous text, so it looks like the README was
          # dropped. Fail loudly here instead of shipping a stale description.
          size=$(wc -c < README.md)
          echo "README.md: $size bytes (AnkiWeb limit 65535)"
          if [ "$size" -gt 65535 ]; then
            echo "::error::README.md is $size bytes; AnkiWeb rejects descriptions over 65535." >&2
            exit 1
          fi

      - name: Attach to GitHub release
        if: steps.ref.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.ref }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Image Search v3 ${{ steps.version.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" "${{ steps.build.outputs.ankiaddon }}" --clobber

      - name: Upload to AnkiWeb
        if: steps.ref.outputs.dry_run != 'true'
        uses: athulkrishna2015/ankiweb-api@v1
        with:
          username: ${{ secrets.ANKIWEB_USERNAME }}
          password: ${{ secrets.ANKIWEB_PASSWORD }}
          addon-id: 178037783
          title: Image Search v3
          tags: Image search yandex
          support-page: https://github.com/athulkrishna2015/Image-Search-v3
          branches: 2.1.1-26.05+
          description-file: README.md
          addon-files: ${{ steps.build.outputs.ankiaddon }}